# Goal - built a ci/cd pipeline (dummy)
name: CICD pipeline

on:
  workflow_dispatch:
    

jobs:
  code:
    runs-on: ubuntu-latest
    steps:
      - name: clone the code
        uses: actions/checkout@v7
        
  build:
    needs: [code]
    runs-on: ubuntu-latest
    steps:
      - name: build the code
        run: echo "code built done    
        
  test:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: test the code
        uses: docker/setup-buildx-action@v4
        
  deply:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: deploy the code
        run: echo "code deployed "
        
        
